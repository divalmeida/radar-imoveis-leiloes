<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Imóveis e Leilões</title>
<meta name="description" content="Imóveis e leilões coletados todo dia">
<meta name="theme-color" content="#0f3d3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone-180.png">
<style>
  :root {
    --fundo: #f4f6f5;
    --cartao: #ffffff;
    --texto: #18211f;
    --suave: #5f6b68;
    --borda: #dfe5e3;
    --marca: #0f3d3e;
    --marca-texto: #ffffff;
    --destaque: #e8f4ef;
    --verde: #1d7a4f;
    --laranja: #b5560b;
    --vermelho: #b3261e;
    --azul: #1f5fa8;
    --chip: #eef2f1;
    --sombra: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0f1413;
      --cartao: #182120;
      --texto: #e8eeec;
      --suave: #9aa8a4;
      --borda: #2a3634;
      --marca: #123f40;
      --destaque: #15302a;
      --verde: #5fc795;
      --laranja: #f0a25c;
      --vermelho: #f2857c;
      --azul: #7fb0ec;
      --chip: #22302d;
      --sombra: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: var(--marca); color: var(--marca-texto);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 0;
    position: sticky; top: 0; z-index: 10;
  }
  .topo { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  .atualizado { font-size: 12px; opacity: .8; text-align: right; }
  nav { display: flex; gap: 4px; max-width: 1100px; margin: 10px auto 0; }
  nav button {
    flex: 1; border: 0; background: transparent; color: var(--marca-texto); opacity: .7;
    font: inherit; font-weight: 600; padding: 10px 8px 12px; border-bottom: 3px solid transparent; cursor: pointer;
  }
  nav button[aria-selected="true"] { opacity: 1; border-bottom-color: #8fe3bd; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }
  .filtros { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-bottom: 12px; }
  .linha { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=search], select {
    font: inherit; font-size: 16px; color: var(--texto); background: var(--cartao);
    border: 1px solid var(--borda); border-radius: 10px; padding: 9px 11px; min-width: 0;
  }
  input[type=search] { flex: 1 1 220px; width: 100%; }
  select { flex: 1 1 140px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--borda); background: var(--cartao); color: var(--texto);
    font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--marca); color: var(--marca-texto); border-color: var(--marca); }
  .resumo { font-size: 13px; color: var(--suave); margin: 4px 2px 10px; }
  .lista { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .cartao {
    background: var(--cartao); border: 1px solid var(--borda); border-radius: 14px; box-shadow: var(--sombra);
    padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  }
  .cartao.prioridade { border-color: var(--verde); background: var(--destaque); }
  .cab { display: flex; gap: 10px; }
  .foto { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--chip); flex: none; }
  .foto.grande { width: 100%; height: 170px; }
  .titulo { font-weight: 600; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .meta { font-size: 12px; color: var(--suave); margin-top: 2px; }
  .ficha { font-size: 13px; color: var(--suave); display: flex; gap: 10px; flex-wrap: wrap; }
  .valores { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .preco { font-size: 19px; font-weight: 700; }
  .riscado { font-size: 13px; color: var(--suave); text-decoration: line-through; font-weight: 400; margin-left: 6px; }
  .rotulo { font-size: 11px; color: var(--suave); display: block; font-weight: 400; }
  .prazo { font-size: 13px; font-weight: 600; text-align: right; }
  .prazo.urgente { color: var(--vermelho); }
  .prazo.breve { color: var(--laranja); }
  .custos { font-size: 13px; color: var(--texto); }
  .link-botao { border: 0; background: none; color: var(--azul); font: inherit; font-weight: 600; cursor: pointer; padding: 0 4px; }
  #im-mapa { height: 60vh; border-radius: 14px; margin-bottom: 12px; border: 1px solid var(--borda); }
  a.link-mapa { font-size: 13px; color: var(--azul); text-decoration: none; }
  details.perto summary { font-size: 13px; color: var(--azul); cursor: pointer; }
  .servicos { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .servico { font-size: 12px; background: var(--chip); border-radius: 6px; padding: 3px 7px; }
  .servico.zero { opacity: .55; }
  a.servico { color: var(--texto); text-decoration: none; }
  details.hist ul { list-style: none; padding-left: 0; }
  details.hist li { padding: 2px 0; }
  .desce { color: var(--verde); }
  .sobe { color: var(--vermelho); }
  details.sim, details.analise-det, .analise { border: 1px solid var(--borda); border-radius: 10px; padding: 8px 10px; }
  .analise small { display: block; color: var(--suave); font-size: 11px; margin-top: 4px; }
  a.pedir { display: inline-block; font-weight: 600; font-size: 13px; color: var(--azul); text-decoration: none; margin-top: 4px; }
  details.analise-det summary { font-size: 13px; }
  details.analise-det b.bom { color: var(--verde); } details.analise-det b.medio { color: var(--laranja); } details.analise-det b.ruim { color: var(--vermelho); }
  .analise-corpo { margin-top: 8px; display: grid; gap: 4px; }
  .regra { font-size: 12px; margin: 4px 0; }
  ul.riscos { font-size: 12px; padding-left: 0; list-style: none; margin: 4px 0; }
  details.sim summary { font-weight: 600; }
  .sim-grade { display: grid; gap: 8px; margin-top: 10px; }
  .sim-campo { display: grid; grid-template-columns: 1fr 110px auto; gap: 6px; align-items: center; font-size: 12px; color: var(--suave); }
  .sim-campo input { font: inherit; font-size: 16px; width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--borda); background: var(--cartao); color: var(--texto); }
  .sim-campo em { font-style: normal; font-size: 12px; }
  .sim-resultado { margin-top: 10px; display: grid; gap: 3px; }
  .sim-linha { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .sim-linha.sub { border-top: 1px dashed var(--borda); padding-top: 4px; }
  .sim-linha.total { font-size: 14px; }
  .sim-linha.bom b { color: var(--verde); }
  .sim-linha.ruim b { color: var(--vermelho); }
  .sim-fin { margin-top: 8px; padding: 8px; border-radius: 8px; background: var(--chip); display: grid; gap: 3px; font-size: 13px; }
  .sim-nota { display: block; margin-top: 8px; color: var(--suave); font-size: 11px; }
  .custos.sem { color: var(--suave); font-size: 12px; }
  .renda { font-size: 13px; background: var(--chip); border-radius: 10px; padding: 8px 10px; }
  .renda b { color: var(--verde); }
  .renda small { display: block; color: var(--suave); font-size: 11px; margin-top: 2px; }
  .selos { display: flex; gap: 6px; flex-wrap: wrap; }
  .selo { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--chip); color: var(--texto); }
  .selo.pf, .selo.fin { color: var(--verde); }
  .selo.pj { color: var(--azul); }
  .selo.desc { color: var(--laranja); }
  .selo.novo { background: var(--azul); color: #fff; }
  .selo.baixou { background: var(--verde); color: #fff; }
  .selo.sobe { background: var(--vermelho); color: #fff; }
  .variacao { font-size: 13px; font-weight: 600; }
  .variacao.desce { color: var(--verde); }
  .variacao.sobe { color: var(--vermelho); }
  .variacao small { font-weight: 400; color: var(--suave); }
  .acoes a {
    display: block; text-align: center; text-decoration: none; font-weight: 600; font-size: 14px;
    padding: 9px; border-radius: 10px; background: var(--marca); color: var(--marca-texto);
  }
  details { font-size: 13px; }
  details summary { cursor: pointer; color: var(--azul); }
  details a { color: var(--azul); }
  details ul { margin: 6px 0 0; padding-left: 18px; }
  .mais { display: block; margin: 16px auto 0; font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--borda); background: var(--cartao); color: var(--texto); cursor: pointer; }
  .vazio { text-align: center; color: var(--suave); padding: 40px 16px; }
  .fontes { font-size: 12px; color: var(--suave); margin-top: 24px; line-height: 1.6; }
  .fontes .erro { color: var(--vermelho); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="topo">
    <h1>Radar Imóveis e Leilões</h1>
    <div class="atualizado" id="atualizado">carregando…</div>
  </div>
  <nav role="tablist">
    <button role="tab" id="aba-imoveis" aria-selected="true">Imóveis</button>
    <button role="tab" id="aba-leiloes" aria-selected="false">Leilões</button>
  </nav>
</header>

<main>
  <!-- ABA IMÓVEIS -->
  <section id="painel-imoveis">
    <div class="filtros">
      <div class="linha">
        <input type="search" id="im-busca" list="im-sugestoes" placeholder="Bairro, cidade, rua ou condomínio…" autocomplete="off">
        <datalist id="im-sugestoes"></datalist>
      </div>
      <div class="chips" id="im-chips-cidade" aria-label="Cidade"></div>
      <div class="chips" id="im-chips-marca" aria-label="Destaques"></div>
      <div class="linha">
        <select id="im-bairro" aria-label="Bairro"><option value="">Todos os bairros</option></select>
        <select id="im-preco" aria-label="Preço máximo">
          <option value="0">Preço: qualquer</option>
          <option value="100000">Até R$ 100 mil</option>
          <option value="150000">Até R$ 150 mil</option>
          <option value="200000">Até R$ 200 mil</option>
          <option value="250000">Até R$ 250 mil</option>
        </select>
      </div>
      <div class="linha">
        <select id="im-quartos" aria-label="Quartos">
          <option value="0">Quartos: todos</option>
          <option value="2">2+ quartos</option>
          <option value="3">3+ quartos</option>
        </select>
        <select id="im-area" aria-label="Área mínima">
          <option value="0">Área: qualquer</option>
          <option value="40">40 m² ou mais</option>
          <option value="50">50 m² ou mais</option>
          <option value="60">60 m² ou mais</option>
          <option value="70">70 m² ou mais</option>
        </select>
        <select id="im-custo" aria-label="Condomínio + IPTU">
          <option value="0">Cond. + IPTU: qualquer</option>
          <option value="300">Até R$ 300/mês</option>
          <option value="500">Até R$ 500/mês</option>
          <option value="800">Até R$ 800/mês</option>
        </select>
                <select id="im-tipo" aria-label="Tipo de imóvel">
          <option value="">Tipo: todos</option>
          <option>Apartamento</option>
          <option>Casa</option>
          <option>Casa em condomínio</option>
        </select>
        <select id="im-portal" aria-label="Portal"><option value="">Todos os portais</option></select>
        <select id="im-ordem" aria-label="Ordenar">
          <option value="recentes">Mais recentes</option>
          <option value="menor">Menor preço</option>
          <option value="rendimento">Maior rendimento</option>
          <option value="m2">Menor preço por m²</option>
          <option value="queda">Maior queda de preço</option>
          <option value="custo">Menor condomínio + IPTU</option>
        </select>
      </div>
    </div>
    <div class="resumo"><span id="im-resumo"></span> <button class="link-botao" id="im-btn-mapa">🗺️ Ver no mapa</button></div>
    <div id="im-mapa" hidden></div>
    <div class="lista" id="im-lista"></div>
    <button class="mais" id="im-mais" hidden>Mostrar mais</button>
    <div class="fontes" id="im-fontes"></div>
  </section>

  <!-- ABA LEILÕES -->
  <section id="painel-leiloes" hidden>
    <div class="filtros">
      <div class="linha">
        <input type="search" id="busca" list="sugestoes" placeholder="Buscar: iphone, notebook, cidade…" autocomplete="off">
        <datalist id="sugestoes"></datalist>
      </div>
      <div class="chips" id="chips-tipo" aria-label="Tipo"></div>
      <div class="chips" id="chips-cidade" aria-label="Cidade"></div>
      <div class="chips" id="chips-uf" aria-label="Estado"></div>
      <div class="linha">
        <select id="publico" aria-label="Quem pode comprar">
          <option value="">PF e PJ (todos)</option>
          <option value="PF e PJ">Aceita pessoa física</option>
          <option value="Só PJ (CNPJ)">Só PJ (CNPJ)</option>
        </select>
        <select id="fonte" aria-label="Fonte"><option value="">Todas as fontes</option></select>
        <select id="variacao" aria-label="Variação de preço">
          <option value="">Preço: qualquer</option>
          <option value="baixou">▼ Baixou de preço</option>
          <option value="subiu">▲ Subiu de preço</option>
          <option value="analisado">📋 Já analisados</option>
        </select>
        <select id="ordem" aria-label="Ordenar">
          <option value="encerra">Encerra primeiro</option>
          <option value="menor">Menor valor</option>
          <option value="desconto">Maior desconto</option>
          <option value="rendimento">Maior rendimento (imóveis)</option>
          <option value="queda">Maior queda de preço</option>
        </select>
      </div>
    </div>
    <div class="resumo" id="resumo"></div>
    <div class="lista" id="lista"></div>
    <button class="mais" id="mais" hidden>Mostrar mais</button>
    <div class="fontes" id="fontes"></div>
  </section>
</main>

<script>
const UFS_DESTAQUE = ["SP", "RJ", "DF", "SC", "BA"];
const POR_PAGINA = 60;
const $ = (id) => document.getElementById(id);
const dinheiro = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const semAcento = (t) => (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const chave = (t) => semAcento(t).toUpperCase().replace(/'/g, " ").replace(/\s+/g, " ").trim();
const escapar = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dataBR = (iso) => iso ? iso.slice(0, 10).split("-").reverse().slice(0, 2).join("/") : "";

/* ---------- Aluguel estimado e custos ---------- */
// O aluguel estimado é calculado na coleta (radar/aluguel.py) para todo imóvel
// à venda: do mais preciso (mesmo bairro, quartos e área) ao mais geral.
let ALUGUEL_CAIXA = {};
let MERCADO_CAIXA = {};
let ANALISES = {};  // índice das análises de imóveis já feitas (docs/dados/analises)
const REPO = "https://github.com/divalmeida/radar-imoveis-leiloes";
const NIVEL = { bairro: "", cidade: "", regiao: " · referência fraca", geral: " · referência muito fraca" };

function blocoRenda(est, preco) {
  if (!preco || !est) return "";
  const rend = (est.valor * 12 / preco) * 100;
  return `<div class="renda">Aluguel estimado <b>${dinheiro.format(est.valor)}/mês</b> · rendimento <b>${rend.toFixed(1).replace(".", ",")}% ao ano</b>
    <small>Mediana de ${est.amostras} aluguéis: ${escapar(est.base)}${NIVEL[est.nivel] || ""}. Bruto (condomínio e IPTU costumam ficar com o inquilino).</small></div>`;
}

function blocoCustos(a) {
  const itens = [];
  if (a.condominio_iptu) itens.push(`Condomínio + IPTU <b>${dinheiro.format(a.condominio_iptu)}</b>/mês`);
  else {
    if (a.condominio) itens.push(`Condomínio <b>${dinheiro.format(a.condominio)}</b>/mês`);
    if (a.iptu) itens.push(a.iptu_anual ? `IPTU <b>${dinheiro.format(a.iptu)}</b>/ano (≈ ${dinheiro.format(a.iptu_mensal)}/mês)` : `IPTU <b>${dinheiro.format(a.iptu)}</b>/mês`);
  }
  if (!itens.length) return `<div class="custos sem">Condomínio e IPTU não informados no anúncio</div>`;
  const total = a.custo_mensal && (a.condominio && a.iptu) ? ` · total <b>${dinheiro.format(a.custo_mensal)}/mês</b>` : "";
  return `<div class="custos">${itens.join(" · ")}${total}</div>`;
}

/* ---------- Abas ---------- */
function trocarAba(qual) {
  const im = qual === "imoveis";
  $("aba-imoveis").setAttribute("aria-selected", im);
  $("aba-leiloes").setAttribute("aria-selected", !im);
  $("painel-imoveis").hidden = !im;
  $("painel-leiloes").hidden = im;
  $("atualizado").textContent = im ? estadoIm.atualizado : estadoLe.atualizado;
  try { localStorage.setItem("aba", qual); } catch (e) {}
}

function chips(el, itens, estado, campo, aoMudar) {
  el.innerHTML = itens.map((i) => `<button class="chip" data-v="${i.id}" aria-pressed="${estado[campo] === i.id}">${i.nome}</button>`).join("");
  el.onclick = (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    estado[campo] = b.dataset.v;
    el.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c.dataset.v === estado[campo]));
    aoMudar();
  };
}

/* ---------- IMÓVEIS ---------- */
const estadoIm = { grupos: [], cidade: "", marca: "", mostrando: POR_PAGINA, atualizado: "carregando…" };

function montarGrupos(anuncios) {
  const porGrupo = new Map();
  for (const a of anuncios) {
    if (!porGrupo.has(a.grupo)) porGrupo.set(a.grupo, []);
    porGrupo.get(a.grupo).push(a);
  }
  return [...porGrupo.values()].map((lista) => {
    lista.sort((x, y) => (x.preco ?? 1e12) - (y.preco ?? 1e12));
    const p = { ...lista[0], outros: lista.slice(1) };
    p.novo = lista.some((a) => a.novo);
    // Variação de preço: vale a do anúncio que mudou (se algum mudou)
    const mudou = lista.find((a) => a.variacao);
    if (mudou) Object.assign(p, { variacao: mudou.variacao, variacao_pct: mudou.variacao_pct, variacao_em: mudou.variacao_em, preco_anterior: mudou.preco_anterior,
      baixou_preco: mudou.variacao < 0, subiu_preco: mudou.variacao > 0, _quemMudou: mudou === lista[0] ? null : mudou });
    p._portais = [...new Set(lista.map((a) => a.fonte))];
    p.financiamento = lista.some((a) => a.financiamento === true) ? true : lista.some((a) => a.financiamento === false) ? false : null;
    // custos: usa o primeiro anúncio do grupo que informou
    const comCusto = lista.find((a) => a.custo_mensal) || lista[0];
    Object.assign(p, { condominio: comCusto.condominio, iptu: comCusto.iptu, iptu_anual: comCusto.iptu_anual, iptu_mensal: comCusto.iptu_mensal,
      condominio_iptu: comCusto.condominio_iptu, custo_mensal: comCusto.custo_mensal });
    p._est = lista.map((a) => a.aluguel).find(Boolean) || null;
    p._rend = p._est && p.preco ? p._est.valor * 12 / p.preco : null;
    p._m2 = p.area && p.preco ? p.preco / p.area : null;
    p._recente = lista.map((a) => a.primeiro_visto || a.publicado_em || "").sort().pop();
    p._busca = semAcento(`${p.titulo} ${p.bairro} ${p.cidade} ${p.endereco} ${p.anunciante}`);
    return p;
  });
}

function filtrarIm() {
  const busca = semAcento($("im-busca").value).split(/\s+/).filter(Boolean);
  const q = +$("im-quartos").value, precoMax = +$("im-preco").value, areaMin = +$("im-area").value;
  const bairro = $("im-bairro").value, portal = $("im-portal").value;
  const custoMax = +$("im-custo").value, tipo = $("im-tipo").value;
  let r = estadoIm.grupos.filter((g) => {
    if (estadoIm.cidade && g._regiao !== estadoIm.cidade) return false;
    if (bairro && `${g.cidade}|${g.bairro}` !== bairro) return false;
    if (precoMax && (g.preco || 0) > precoMax) return false;
    if (areaMin && (g.area || 0) < areaMin) return false;
    if (custoMax && !(g.custo_mensal && g.custo_mensal <= custoMax)) return false;
    if (tipo && (g.tipo || "Apartamento") !== tipo) return false;
    if (portal && !g._portais.includes(portal)) return false;
    if (estadoIm.marca === "novos" && !g.novo) return false;
    if (estadoIm.marca === "baixou" && !g.baixou_preco) return false;
    if (estadoIm.marca === "subiu" && !g.subiu_preco) return false;
    if (estadoIm.marca === "financiamento" && g.financiamento !== true) return false;
    if (estadoIm.marca === "rendimento" && !(g._rend >= 0.08)) return false;
    if (q && (g.quartos || 0) < q) return false;
    return busca.every((p) => g._busca.includes(p));
  });
  const o = $("im-ordem").value;
  if (o === "menor") r.sort((a, b) => (a.preco ?? 1e12) - (b.preco ?? 1e12));
  else if (o === "rendimento") r.sort((a, b) => (b._rend ?? -1) - (a._rend ?? -1));
  else if (o === "m2") r.sort((a, b) => (a._m2 ?? 1e12) - (b._m2 ?? 1e12));
  else if (o === "custo") r.sort((a, b) => (a.custo_mensal ?? 1e9) - (b.custo_mensal ?? 1e9));
  else if (o === "queda") r.sort((a, b) => (a.variacao_pct ?? 0) - (b.variacao_pct ?? 0));
  else r.sort((a, b) => (b.novo - a.novo) || (b.baixou_preco - a.baixou_preco) || (b._recente || "").localeCompare(a._recente || ""));
  return r;
}

function cartaoIm(g) {
  const selos = [];
  if (g.novo) selos.push(`<span class="selo novo">Novo</span>`);
  if (g.baixou_preco) selos.push(`<span class="selo baixou">Baixou de preço</span>`);
  if (g.subiu_preco) selos.push(`<span class="selo sobe">Subiu de preço</span>`);
  if (g.financiamento === true) selos.push(`<span class="selo fin">Aceita financiamento</span>`);
  else if (g.financiamento === false) selos.push(`<span class="selo pj">Só à vista</span>`);
  else selos.push(`<span class="selo">Financiamento não informado</span>`);
  if (g.na_planta) selos.push(`<span class="selo">Na planta</span>`);
  selos.push(`<span class="selo">${escapar(g.fonte)}</span>`);

  const ficha = [g.tipo && g.tipo !== "Apartamento" && g.tipo, g.quartos && `${g.quartos} quartos`, g.area && `${g.area} m²`, g.banheiros && `${g.banheiros} banh.`,
    g._m2 && `${dinheiro.format(g._m2)}/m²`].filter(Boolean);

  const outros = g.outros.length ? `<details><summary>Mais ${g.outros.length} anúncio${g.outros.length > 1 ? "s" : ""} do mesmo imóvel</summary><ul>${
    g.outros.map((o) => `<li><a href="${escapar(o.link)}" target="_blank" rel="noopener">${escapar(o.anunciante || o.fonte)}</a> · ${o.preco ? dinheiro.format(o.preco) : "—"}</li>`).join("")}</ul></details>` : "";

  return `<article class="cartao${g.novo || g.baixou_preco ? " prioridade" : ""}">
    ${g.imagem ? `<img class="foto grande" loading="lazy" src="${escapar(g.imagem)}" alt="">` : ""}
    <div><div class="titulo">${escapar(g.titulo)}</div>
      <div class="meta">${escapar(g.bairro)}, ${escapar(g.cidade)}${g.anunciante ? " · " + escapar(g.anunciante) : ""}</div></div>
    <div class="valores"><div class="preco">${g.preco ? dinheiro.format(g.preco) : "—"}</div></div>
    ${g.variacao ? `<div class="variacao ${g.variacao < 0 ? "desce" : "sobe"}">${g.variacao < 0 ? "▼ Baixou" : "▲ Subiu"} ${dinheiro.format(Math.abs(g.variacao))}
      (${g.variacao < 0 ? "−" : "+"}${String(Math.abs(g.variacao_pct)).replace(".", ",")}%) em ${dataBR(g.variacao_em)} · antes ${dinheiro.format(g.preco_anterior)}${g._quemMudou ? ` <small>(anúncio de ${escapar(g._quemMudou.anunciante || g._quemMudou.fonte)})</small>` : ""}</div>` : ""}
    <div class="ficha">${ficha.map((f) => `<span>${f}</span>`).join("")}</div>
    ${blocoCustos(g)}
    ${blocoRenda(g._est, g.preco)}
    <div class="selos">${selos.join("")}</div>
    ${outros}
    ${g.lat && g.lon ? `<details class="perto" data-lat="${g.lat}" data-lon="${g.lon}"><summary>📍 O que tem por perto</summary><div class="perto-corpo"></div></details>`
      : `<a class="link-mapa" href="https://www.google.com/maps/search/${encodeURIComponent(`${g.endereco || ""} ${g.bairro}, ${g.cidade} - ${g.uf}`)}" target="_blank" rel="noopener">📍 Abrir no mapa</a>`}
    <div class="acoes"><a href="${escapar(g.link)}" target="_blank" rel="noopener">Ver anúncio</a></div>
  </article>`;
}

function desenharIm(reiniciar) {
  if (reiniciar) estadoIm.mostrando = POR_PAGINA;
  const r = filtrarIm();
  $("im-resumo").textContent = `${r.length.toLocaleString("pt-BR")} imóve${r.length === 1 ? "l" : "is"}`;
  $("im-lista").innerHTML = r.length ? r.slice(0, estadoIm.mostrando).map(cartaoIm).join("") : `<div class="vazio">Nenhum imóvel com esses filtros.</div>`;
  $("im-mais").hidden = r.length <= estadoIm.mostrando;
  $("im-lista").querySelectorAll("details.perto").forEach((d) => d.addEventListener("toggle", () => d.open && abrirPerto(d)));
  if (!$("im-mapa").hidden) desenharMapa();
}

function iniciarImoveis(dados) {
  ALUGUEL_CAIXA = dados.aluguel_caixa || {};
  MERCADO_CAIXA = dados.mercado_caixa || {};
  estadoIm.atualizado = `atualizado ${dataBR(dados.atualizado_em)} · ${dados.atualizado_em.slice(11)}`;
  estadoIm.grupos = montarGrupos(dados.anuncios);
  const f = dados.filtros;
  if (f.regioes) REGIOES = f.regioes;
  estadoIm.grupos.forEach((g) => (g._regiao = regiaoDe(g.cidade)));
  const contar = (r) => estadoIm.grupos.filter((g) => g._regiao === r).length;
  chips($("im-chips-cidade"), [{ id: "", nome: "Todas as regiões" }, ...REGIOES.map((r) => ({ id: r.nome, nome: `${r.nome} (${contar(r.nome)})` }))], estadoIm, "cidade", () => {
    preencherBairros(); desenharIm(true);
  });
  chips($("im-chips-marca"), [
    { id: "", nome: "Todos" }, { id: "novos", nome: "Novos" }, { id: "baixou", nome: "▼ Baixaram de preço" }, { id: "subiu", nome: "▲ Subiram de preço" },
    { id: "financiamento", nome: "Aceita financiamento" }, { id: "rendimento", nome: "Rendimento 8%+ ao ano" },
  ], estadoIm, "marca", () => desenharIm(true));

  // Sugestões enquanto digita: cidades e bairros
  const bairros = new Map();
  estadoIm.grupos.forEach((g) => g.bairro && bairros.set(`${g.cidade}|${g.bairro}`, (bairros.get(`${g.cidade}|${g.bairro}`) || 0) + 1));
  $("im-sugestoes").innerHTML = [...f.cidades, ...[...bairros.keys()].map((k) => k.split("|")[1])]
    .filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a.localeCompare(b)).map((v) => `<option value="${escapar(v)}">`).join("");

  // Lista de bairros da cidade escolhida, com quantos imóveis cada um tem
  function preencherBairros() {
    const regiao = REGIOES.find((r) => r.nome === estadoIm.cidade);
    const umaCidade = regiao && regiao.cidades.length === 1;
    const lista = [...bairros.entries()].filter(([k]) => !regiao || regiao.cidades.includes(k.split("|")[0]))
      .sort((a, b) => a[0].split("|")[1].localeCompare(b[0].split("|")[1]));
    $("im-bairro").innerHTML = `<option value="">Todos os bairros (${lista.length})</option>` +
      lista.map(([k, n]) => `<option value="${escapar(k)}">${escapar(k.split("|")[1])}${umaCidade ? "" : " - " + escapar(k.split("|")[0])} (${n})</option>`).join("");
  }
  preencherBairros();
  const portais = [...new Set(estadoIm.grupos.flatMap((g) => g._portais))].sort();
  $("im-portal").innerHTML = `<option value="">Todos os portais</option>` + portais.map((p) => `<option>${escapar(p)}</option>`).join("");
  $("im-fontes").innerHTML = `Apartamentos à venda até ${dinheiro.format(f.preco_maximo_compra)}, ${f.quartos_minimo}+ quartos. ` +
    `Aluguel estimado com base em ${dados.alugueis.length} anúncios de aluguel (até ${dinheiro.format(f.preco_maximo_aluguel)}).<br>Fontes: ` +
    Object.entries(dados.fontes).map(([n, s]) => s.ok ? `${escapar(n)} (${s.anuncios})` : `<span class="erro">${escapar(n)} (falhou)</span>`).join(" · ");
  let espera;
  $("im-busca").oninput = () => { clearTimeout(espera); espera = setTimeout(() => desenharIm(true), 200); };
  ["im-quartos", "im-ordem", "im-bairro", "im-preco", "im-area", "im-portal", "im-custo", "im-tipo"].forEach((id) => ($(id).onchange = () => desenharIm(true)));
  $("im-mais").onclick = () => { estadoIm.mostrando += POR_PAGINA; desenharIm(false); };
  $("im-btn-mapa").onclick = () => {
    const area = $("im-mapa"); area.hidden = !area.hidden;
    $("im-btn-mapa").textContent = area.hidden ? "🗺️ Ver no mapa" : "📋 Esconder o mapa";
    desenharMapa();
  };
  desenharIm(true);
}

/* ---------- Mapa e "o que tem por perto" ---------- */
let MAPA = null, CAMADA = null;

function carregarLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((ok, erro) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    js.onload = ok; js.onerror = erro;
    document.head.appendChild(js);
  });
}

async function desenharMapa() {
  const area = $("im-mapa");
  if (area.hidden) return;
  await carregarLeaflet();
  if (!MAPA) {
    MAPA = L.map(area).setView([-12.97, -38.50], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(MAPA);
  }
  if (CAMADA) CAMADA.remove();
  CAMADA = L.layerGroup().addTo(MAPA);
  const pontos = filtrarIm().filter((g) => g.lat && g.lon).slice(0, 1500);
  pontos.forEach((g) => {
    const cor = g.novo ? "#1f5fa8" : g.baixou_preco ? "#1d7a4f" : "#0f3d3e";
    L.circleMarker([g.lat, g.lon], { radius: 6, color: cor, fillColor: cor, fillOpacity: 0.8, weight: 1 })
      .bindPopup(`<b>${dinheiro.format(g.preco)}</b><br>${escapar(g.titulo).slice(0, 90)}<br>${escapar(g.bairro)}, ${escapar(g.cidade)}<br><a href="${escapar(g.link)}" target="_blank" rel="noopener">Ver anúncio</a>`)
      .addTo(CAMADA);
  });
  if (pontos.length) MAPA.fitBounds(pontos.map((g) => [g.lat, g.lon]), { padding: [20, 20], maxZoom: 15 });
  setTimeout(() => MAPA.invalidateSize(), 50);
}

// Conta serviços num raio de 1 km pelo OpenStreetMap (Overpass)
const SERVICOS = [
  ["🛒 Mercados", 'nwr["shop"~"supermarket|convenience|greengrocer|bakery"]'],
  ["💊 Farmácias", 'nwr["amenity"="pharmacy"]'],
  ["🏫 Escolas", 'nwr["amenity"~"school|kindergarten"]'],
  ["🏥 Saúde", 'nwr["amenity"~"hospital|clinic|doctors"]'],
  ["🚌 Ônibus/metrô", 'nwr["highway"="bus_stop"];nwr["railway"~"station|halt"];nwr["public_transport"="station"]'],
  ["🏦 Bancos", 'nwr["amenity"~"bank|atm"]'],
  ["🍽️ Restaurantes", 'nwr["amenity"~"restaurant|fast_food|cafe"]'],
  ["🌳 Praças/parques", 'nwr["leisure"~"park|playground"]'],
];

async function abrirPerto(det) {
  if (det.dataset.pronto) return;
  det.dataset.pronto = "1";
  const corpo = det.querySelector(".perto-corpo");
  const lat = det.dataset.lat, lon = det.dataset.lon;
  // Atalhos que sempre funcionam: o Google Maps já abre buscando cada serviço em volta do imóvel
  const atalhos = [["🛒", "supermercado"], ["💊", "farmácia"], ["🏫", "escola"], ["🏥", "hospital"], ["🚌", "ponto de ônibus"], ["🏦", "banco"]]
    .map(([i, q]) => `<a class="servico" href="https://www.google.com/maps/search/${encodeURIComponent(q)}/@${lat},${lon},16z" target="_blank" rel="noopener">${i} ${q}</a>`).join("");
  corpo.innerHTML = `<div class="servicos">${atalhos}</div><small class="contagem">Contando serviços num raio de 1 km…</small>`;
  const contagem = corpo.querySelector(".contagem");
  const consulta = "[out:json][timeout:20];(" + SERVICOS.map(([n, q], i) =>
    q.split(";").map((x) => `${x}(around:1000,${lat},${lon});`).join("")).join("") + ");out center tags;";
  try {
    const r = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: "data=" + encodeURIComponent(consulta),
      signal: AbortSignal.timeout(12000) });
    const dados = await r.json();
    const conta = SERVICOS.map(([nome, q]) => {
      const testes = q.split(";").map((x) => [...x.matchAll(/"(\w+)"(=|~)"([^"]+)"/g)].map((m) => [m[1], m[2], m[3]]));
      const n = dados.elements.filter((e) => testes.some((t) => t.every(([k, op, v]) => e.tags && e.tags[k] && (op === "=" ? e.tags[k] === v : new RegExp(v).test(e.tags[k]))))).length;
      return `<span class="servico ${n ? "" : "zero"}">${nome}: <b>${n}</b></span>`;
    });
    contagem.outerHTML = `<div class="servicos">${conta.join("")}</div>
      <small>Num raio de 1 km (OpenStreetMap; pode estar incompleto).</small>`;
  } catch (e) {
    contagem.textContent = "Toque num serviço acima para ver no Google Maps (a contagem automática não respondeu agora).";
  }
}

/* ---------- LEILÕES ---------- */
const TIPOS = [
  { id: "", nome: "Tudo" },
  { id: "eletronicos", nome: "Eletrônicos e celulares" },
  { id: "eletrodomesticos", nome: "Eletrodomésticos" },
  { id: "imoveis", nome: "Imóveis de leilão" },
];
// Regiões da aba Imóveis (vêm do imoveis.json; esta lista é só a reserva se ele não carregar)
let REGIOES = ["Salvador", "Feira de Santana", "Conceição do Jacuípe"].map((c) => ({ nome: c, cidades: [c] }));
function regiaoDe(cidade) {
  const r = REGIOES.find((x) => x.cidades.some((c) => chave(c) === chave(cidade)));
  return r ? r.nome : null;
}
const estadoLe = { lotes: [], tipo: "", uf: "", cidade: "", mostrando: POR_PAGINA, atualizado: "carregando…" };

function tipoDoLote(l) {
  if (l.fonte === "Caixa" || (l.categoria || "").startsWith("Imóvel")) return "imoveis";
  if (/ELETRODOM|ELETROPORT|REFRIGER|FOGO|FORNO|LIMPEZA|UTENS/i.test(l.categoria)) return "eletrodomesticos";
  return "eletronicos";
}

function dataDe(texto) {
  if (!texto) return null;
  const [d, h] = texto.split(" ");
  return new Date(`${d}T${h || "00:00"}:00-03:00`);
}

function prazo(l) {
  const fim = dataDe(l.encerramento);
  if (!fim) return { texto: l.fonte === "Caixa" ? "Venda direta" : "", classe: "" };
  const horas = (fim - Date.now()) / 36e5;
  const quando = fim.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
  if (horas < 0) return { texto: `Encerrado ${quando}`, classe: "urgente" };
  if (horas < 24) return { texto: `Encerra hoje · ${quando}`, classe: "urgente" };
  const dias = Math.round(horas / 24);
  return { texto: `Encerra em ${dias} dia${dias > 1 ? "s" : ""} · ${quando}`, classe: dias <= 3 ? "breve" : "" };
}

function desconto(l) {
  if (l.detalhes && l.detalhes.desconto_pct != null) return l.detalhes.desconto_pct;
  if (l.valor_avaliacao && l.lance_atual) return Math.round((1 - l.lance_atual / l.valor_avaliacao) * 100);
  return null;
}

function filtrarLe() {
  const busca = semAcento($("busca").value).split(/\s+/).filter(Boolean);
  const publico = $("publico").value, fonte = $("fonte").value, variacao = $("variacao").value;
  const agora = Date.now();
  let r = estadoLe.lotes.filter((l) => {
    const fim = dataDe(l.encerramento);
    if (fim && fim < agora) return false;
    if (estadoLe.tipo && l._tipo !== estadoLe.tipo) return false;
    if (estadoLe.cidade && l._regiao !== estadoLe.cidade) return false;
    if (estadoLe.uf && l.uf !== estadoLe.uf) return false;
    if (publico && l.publico !== publico) return false;
    if (fonte && l.fonte !== fonte) return false;
    if (variacao === "baixou" && !l.baixou_preco) return false;
    if (variacao === "subiu" && !l.subiu_preco) return false;
    if (variacao === "analisado" && !ANALISES[l.id]) return false;
    return busca.every((p) => l._busca.includes(p));
  });
  const ordem = $("ordem").value;
  if (ordem === "menor") r.sort((a, b) => (a.lance_atual ?? 1e15) - (b.lance_atual ?? 1e15));
  else if (ordem === "desconto") r.sort((a, b) => (desconto(b) ?? -1) - (desconto(a) ?? -1));
  else if (ordem === "rendimento") r.sort((a, b) => (b._rend ?? -1) - (a._rend ?? -1));
  else if (ordem === "queda") r.sort((a, b) => (a.variacao_total_pct ?? 0) - (b.variacao_total_pct ?? 0));
  // Com data: o que encerra antes vem primeiro. Sem data (Caixa): cidades prioritárias primeiro.
  else r.sort((a, b) => (a.encerramento || "9").localeCompare(b.encerramento || "9") || (!!b.prioridade - !!a.prioridade) || (!!b.destaque - !!a.destaque));
  return r;
}

function cartaoLe(l) {
  const p = prazo(l), d = desconto(l);
  const selos = [];
  selos.push(l.publico === "Só PJ (CNPJ)" ? `<span class="selo pj">Só PJ (CNPJ)</span>` : `<span class="selo pf">PF e PJ</span>`);
  if (l.detalhes && l.detalhes.financiamento) selos.push(`<span class="selo fin">Aceita financiamento</span>`);
  if (d != null && d > 0) selos.push(`<span class="selo desc">${Math.round(d)}% abaixo da avaliação</span>`);
  selos.push(`<span class="selo">${escapar(l.fonte)}</span>`);
  const rotulo = l.fonte === "Receita Federal" ? "Lance mínimo" : l.fonte === "Caixa" ? "Preço" : "Lance atual";
  const foto = l.imagem ? `<img class="foto" loading="lazy" src="${escapar(l.imagem)}" alt="">` : "";
  return `<article class="cartao${l.prioridade ? " prioridade" : ""}">
    <div class="cab">${foto}<div style="min-width:0">
      <div class="titulo">${escapar(l.titulo)}</div>
      <div class="meta">${escapar(l.cidade)}${l.uf ? " - " + escapar(l.uf) : ""} · ${escapar(l.categoria)}</div>
    </div></div>
    <div class="valores">
      <div class="preco"><span class="rotulo">${rotulo}</span>${l.lance_atual != null ? dinheiro.format(l.lance_atual) : "—"}</div>
      <div class="prazo ${p.classe}">${escapar(p.texto)}</div>
    </div>
    ${blocoVariacao(l)}
    ${l._est ? blocoRenda(l._est, l.lance_atual) : ""}
    <div class="selos">${selos.join("")}</div>
    ${blocoHistorico(l)}
    ${l.fonte === "Caixa" ? blocoAnalise(l) : ""}
    ${l._tipo === "imoveis" ? `<a class="link-mapa" href="https://www.google.com/maps/search/${encodeURIComponent(`${(l.detalhes && (l.detalhes.endereco || l.detalhes.bairro)) || ""} ${l.cidade} - ${l.uf}`)}" target="_blank" rel="noopener">📍 Abrir no mapa</a>` : ""}
    ${l._tipo === "imoveis" ? `<details class="sim" data-id="${escapar(l.id)}"><summary>Simular custo final e financiamento</summary><div class="sim-corpo"></div></details>` : ""}
    <div class="acoes"><a href="${escapar(l.link)}" target="_blank" rel="noopener">Abrir no site do leilão</a></div>
  </article>`;
}

/* ---------- Análise do imóvel (matrícula, ocupação, pagamento) ---------- */
function blocoAnalise(l) {
  const numero = l.id.replace("caixa-", "");
  const pedir = `${REPO}/issues/new?title=${encodeURIComponent("Análise caixa-" + numero)}&body=${encodeURIComponent(
    "Pedido de análise do imóvel " + numero + "\n" + l.link + "\n\nÉ só tocar em Create / Submit. A resposta chega aqui e no app em uns 5 minutos.")}`;
  const a = ANALISES[l.id];
  if (!a) {
    return `<div class="analise"><a class="pedir" href="${pedir}" target="_blank" rel="noopener">📋 Pedir análise da matrícula e do imóvel</a>
      <small>Abre um pedido no GitHub (precisa estar logada). A análise aparece aqui em uns 5 minutos.</small></div>`;
  }
  const cor = a.resumo === "Risco alto" ? "ruim" : a.resumo === "Atenção" ? "medio" : a.resumo ? "bom" : "";
  return `<details class="analise-det" data-numero="${numero}"><summary>📋 Análise de ${dataBR(a.analisado_em)}:
      <b class="${cor}">${escapar(a.resumo || "incompleta")}</b>${a.nota_risco != null ? ` · nota ${String(a.nota_risco).replace(".", ",")}/10` : ""}
      · ocupação: ${escapar(a.ocupacao || "não informada")}</summary><div class="analise-corpo">carregando…</div>
      <a class="pedir" href="${pedir}" target="_blank" rel="noopener">Pedir nova análise</a></details>`;
}

async function abrirAnalise(det) {
  if (det.dataset.pronto) return;
  det.dataset.pronto = "1";
  const corpo = det.querySelector(".analise-corpo");
  let r;
  try { r = await carregar(`analises/${det.dataset.numero}.json`); } catch (e) { corpo.textContent = "Não consegui abrir a análise agora."; return; }
  const d = r.detalhe || {}, m = r.matricula;
  const item = (rot, val) => (val ? `<div class="sim-linha"><span>${rot}</span><b>${escapar(val)}</b></div>` : "");
  let html = "";
  if (d.disponivel) {
    html += item("Matrícula", `${d.matricula || "?"} · ${d.oficio || "?"}º ofício · ${d.comarca || ""}`) +
      item("Ocupação", d.ocupacao || "não informada pela Caixa (trate como ocupado)") +
      item("Financiamento", d.aceita_financiamento ? "aceita" : "não aceita") + item("FGTS", d.aceita_fgts ? "aceita" : "não aceita") +
      item("Parcelamento", d.aceita_parcelamento ? "aceita" : "não aceita") + item("Leilões negativos", d.leiloes_negativos) +
      item("Área privativa", d.area_privativa ? d.area_privativa + " m²" : null) +
      `<p class="regra"><b>Pagamento:</b> ${escapar(d.formas_pagamento || "—")}</p>` +
      (d.regra_condominio ? `<p class="regra"><b>Condomínio atrasado:</b> ${escapar(d.regra_condominio)}</p>` : "") +
      (d.regra_tributos ? `<p class="regra"><b>IPTU atrasado:</b> ${escapar(d.regra_tributos)}</p>` : "");
  }
  if (m) {
    html += `<p class="regra"><b>Matrícula: ${escapar(m.resumo)}</b> (nota ${String(m.nota_risco).replace(".", ",")}/10${m.data_documento ? `, documento de ${dataBR(m.data_documento)}/${m.data_documento.slice(0, 4)}` : ""})</p><ul class="riscos">` +
      m.pontos_ok.map((x) => `<li>✅ ${escapar(x)}</li>`).join("") +
      m.riscos.map((x) => `<li>${x.nivel === "alto" ? "🔴" : "🟡"} ${escapar(x.texto)}</li>`).join("") + `</ul>` +
      `<details class="hist"><summary>Atos da matrícula (${m.atos.length})</summary><ul>${m.atos.map((a) =>
        `<li><b>${escapar(a.ato)}</b> ${a.data ? dataBR(a.data) + "/" + a.data.slice(0, 4) : ""} · ${escapar(a.tipo)}${a.cancelado ? " (cancelado)" : ""}${a.onus && !a.cancelado ? " ⚠️" : ""}</li>`).join("")}</ul></details>`;
  }
  if (r.matricula_url) html += `<p class="regra"><a href="${escapar(r.matricula_url)}" target="_blank" rel="noopener">Abrir o PDF da matrícula (Caixa)</a></p>`;
  html += (r.avisos || []).map((a) => `<p class="regra">⚠️ ${escapar(a)}</p>`).join("");
  html += `<small class="sim-nota">Análise automática de apoio. Para comprar, peça a certidão de inteiro teor atualizada (registradores.onr.org.br) e confira o edital.</small>`;
  corpo.innerHTML = html;
}

/* ---------- Histórico de preço dos leilões ---------- */
function blocoVariacao(l) {
  if (!l.variacao) return "";
  const desce = l.variacao < 0;
  const total = l.variacao_total_pct != null && l.historico_precos.length > 2
    ? ` · desde ${dataBR(l.historico_precos[0].data)}: ${l.variacao_total_pct > 0 ? "+" : ""}${String(l.variacao_total_pct).replace(".", ",")}%` : "";
  return `<div class="variacao ${desce ? "desce" : "sobe"}">${desce ? "▼ Baixou" : "▲ Subiu"} ${dinheiro.format(Math.abs(l.variacao))}
    (${desce ? "−" : "+"}${String(Math.abs(l.variacao_pct)).replace(".", ",")}%) em ${dataBR(l.variacao_em)} · antes ${dinheiro.format(l.preco_anterior)}${total}</div>`;
}

function blocoHistorico(l) {
  const h = l.historico_precos || [];
  if (h.length < 2) return l.primeiro_visto ? `<div class="custos sem">No Radar desde ${dataBR(l.primeiro_visto)} · preço sem mudança</div>` : "";
  return `<details class="hist"><summary>Histórico de preço (${h.length} registros desde ${dataBR(h[0].data)})</summary><ul>${
    h.slice().reverse().map((x, i, a) => {
      const ant = a[i + 1];
      const dif = ant ? (x.preco - ant.preco) / ant.preco * 100 : null;
      return `<li>${dataBR(x.data)}: <b>${dinheiro.format(x.preco)}</b>${dif == null ? " (primeiro registro)" : ` <span class="${dif < 0 ? "desce" : "sobe"}">${dif < 0 ? "▼" : "▲"} ${Math.abs(dif).toFixed(1).replace(".", ",")}%</span>`}</li>`;
    }).join("")}</ul></details>`;
}

/* ---------- Simulador de custo final (imóveis da Caixa) ---------- */
// Valores-padrão editáveis. São estimativas: confirme no edital, na prefeitura e no cartório.
const PADRAO = { itbi: 3, comissaoLeilao: 5, registroPct: 1.2, registroMin: 1000, certidoes: 300, desocupacao: 6000,
  reformaM2: 300, reformaSemArea: 10000, entrada: 20, juros: 11.5, prazo: 420, corretagem: 6 };

function areaCaixa(l) {
  if (l.detalhes && l.detalhes.area) return l.detalhes.area;  // Zuk e Frazão já trazem a área
  const d = (l.detalhes && l.detalhes.descricao) || "";
  const m = /([\d.]+) de área privativa/.exec(d) || /([\d.]+) de área total/.exec(d);
  const v = m ? parseFloat(m[1]) : 0;
  return v > 0 ? v : null;
}

function campo(id, rotulo, valor, sufixo = "", passo = "any") {
  return `<label class="sim-campo"><span>${rotulo}</span><input type="number" inputmode="decimal" step="${passo}" data-c="${id}" value="${valor}">${sufixo ? `<em>${sufixo}</em>` : ""}</label>`;
}

function montarSimulador(det) {
  const l = estadoLe.lotes.find((x) => x.id === det.dataset.id);
  if (!l || det.dataset.pronto) return;
  det.dataset.pronto = "1";
  const modalidade = (l.detalhes && l.detalhes.modalidade) || "";
  const comLeiloeiro = /leil|licita/i.test(modalidade);
  const area = areaCaixa(l);
  const caixa = l.fonte === "Caixa";
  const terreno = /terreno|lote|rural/i.test(l.categoria || "");
  const desc = l.detalhes && l.detalhes.desconto_pct;
  // Sem avaliação informada, estima pelo desconto que o site mostra (lance = avaliação × (1 − desconto))
  const avaliacao = l.valor_avaliacao || (desc && desc < 95 ? Math.round((l.lance_atual || 0) / (1 - desc / 100)) : 0);
  const merc = MERCADO_CAIXA[l.id];
  const financia = !!(l.detalhes && l.detalhes.financiamento);
  det.querySelector(".sim-corpo").innerHTML = `
    <div class="sim-grade">
      ${campo("compra", "Valor de compra (lance)", Math.round(l.lance_atual || 0), "R$")}
      ${campo("comissao", `Comissão do leiloeiro${comLeiloeiro ? "" : " (venda online: sem leiloeiro)"}`, comLeiloeiro ? PADRAO.comissaoLeilao : 0, "%")}
      ${campo("itbi", "ITBI (prefeitura)", PADRAO.itbi, "%")}
      ${campo("registro", "Registro em cartório + certidões (estimativa)", "", "R$")}
      ${caixa ? campo("dividas", "Dívidas de condomínio e IPTU (pior caso: 10% da avaliação)", Math.round(avaliacao * 0.10), "R$")
               : campo("dividas", "Dívidas de condomínio e IPTU (veja no edital quem paga)", 0, "R$")}
      ${campo("desocupacao", terreno ? "Desocupação (terreno)" : "Desocupação (ocupação não informada)", terreno ? 0 : PADRAO.desocupacao, "R$")}
      ${campo("reforma", terreno ? "Reforma / obra (terreno: preencha se for construir)" : `Reforma${area ? ` (${area} m² × R$ ${PADRAO.reformaM2})` : ""}`,
        terreno ? 0 : Math.round(area ? area * PADRAO.reformaM2 : PADRAO.reformaSemArea), "R$")}
      ${campo("mercado", merc ? `Valor de mercado (${escapar(merc.base)})` : avaliacao ? "Valor de mercado (sem referência: usando a avaliação)" : "Valor de mercado (sem referência: preencha)", Math.round(merc ? merc.valor : avaliacao || l.lance_atual || 0), "R$")}
      ${campo("corretagem", "Custos para revender (corretagem)", PADRAO.corretagem, "%")}
      ${financia ? `
      ${campo("entrada", "Entrada do financiamento", PADRAO.entrada, "%")}
      ${campo("juros", "Juros ao ano", PADRAO.juros, "%")}
      ${campo("prazo", "Prazo", PADRAO.prazo, "meses", "1")}` : ""}
    </div>
    <div class="sim-resultado"></div>
    <small class="sim-nota">Estimativas. ITBI calculado sobre o valor de compra; o registro segue a tabela de cartório da Bahia (aqui, ~1,2% com mínimo de R$ 1.000).
      Condomínio/IPTU: pela regra da Caixa o comprador paga até 10% da avaliação. Confira tudo no edital antes de dar lance.</small>`;
  det.addEventListener("input", () => calcularSimulador(det, l, financia));
  calcularSimulador(det, l, financia);
}

function calcularSimulador(det, l, financia) {
  const v = (id) => { const e = det.querySelector(`[data-c="${id}"]`); return e && e.value !== "" ? parseFloat(e.value) : null; };
  const compra = v("compra") || 0;
  const regEl = det.querySelector('[data-c="registro"]');
  const registroAuto = Math.round(Math.max(PADRAO.registroMin, compra * PADRAO.registroPct / 100) + PADRAO.certidoes);
  if (!regEl.dataset.editado) regEl.value = registroAuto;
  regEl.oninput = () => (regEl.dataset.editado = "1");
  const comissao = compra * (v("comissao") || 0) / 100;
  const itbi = compra * (v("itbi") || 0) / 100;
  const registro = v("registro") || 0, dividas = v("dividas") || 0, desoc = v("desocupacao") || 0, reforma = v("reforma") || 0;
  const extras = comissao + itbi + registro + dividas + desoc + reforma;
  const total = compra + extras;
  const mercado = v("mercado") || 0;
  const lucro = mercado * (1 - (v("corretagem") || 0) / 100) - total;
  const aluguel = ALUGUEL_CAIXA[l.id];
  const linha = (rot, val, cls = "") => `<div class="sim-linha ${cls}"><span>${rot}</span><b>${val}</b></div>`;
  let html = linha("Comissão do leiloeiro", dinheiro.format(comissao)) + linha("ITBI", dinheiro.format(itbi)) +
    linha("Registro e certidões", dinheiro.format(registro)) + linha("Dívidas (condomínio/IPTU)", dinheiro.format(dividas)) +
    linha("Desocupação", dinheiro.format(desoc)) + linha("Reforma", dinheiro.format(reforma)) +
    linha("Custos extras", dinheiro.format(extras), "sub") + linha("Custo total estimado", dinheiro.format(total), "total") +
    linha("Valor de mercado estimado", dinheiro.format(mercado)) +
    linha(lucro >= 0 ? "Lucro estimado na revenda" : "Prejuízo estimado na revenda", `${dinheiro.format(lucro)} (${total ? (lucro / total * 100).toFixed(0) : 0}%)`, lucro >= 0 ? "bom" : "ruim");
  if (aluguel) html += linha("Aluguel estimado", `${dinheiro.format(aluguel.valor)}/mês · ${(aluguel.valor * 12 / total * 100).toFixed(1).replace(".", ",")}% ao ano sobre o custo total`);
  if (financia) {
    const ent = compra * (v("entrada") || 0) / 100, fin = compra - ent;
    const n = v("prazo") || 1, i = Math.pow(1 + (v("juros") || 0) / 100, 1 / 12) - 1;
    const parcela = fin / n + fin * i; // tabela SAC: primeira parcela (as próximas diminuem)
    html += `<div class="sim-fin"><b>Financiamento Caixa (SBPE)</b>` +
      linha("Entrada", dinheiro.format(ent)) + linha("Valor financiado", dinheiro.format(fin)) +
      linha("1ª parcela (SAC, sem seguros)", dinheiro.format(parcela)) +
      linha("Dinheiro necessário no início (entrada + custos extras)", dinheiro.format(ent + extras), "total") + `</div>`;
  } else {
    html += `<div class="sim-fin"><b>${l.fonte === "Caixa" ? "Só à vista</b> (este imóvel não aceita financiamento)" : "Pagamento conforme o edital</b> (à vista ou parcelado; confira)"}` + linha("Dinheiro necessário (à vista)", dinheiro.format(total), "total") + `</div>`;
  }
  det.querySelector(".sim-resultado").innerHTML = html;
}

function desenharLe(reiniciar) {
  if (reiniciar) estadoLe.mostrando = POR_PAGINA;
  const r = filtrarLe();
  $("resumo").textContent = `${r.length.toLocaleString("pt-BR")} resultado${r.length === 1 ? "" : "s"}`;
  $("lista").innerHTML = r.length ? r.slice(0, estadoLe.mostrando).map(cartaoLe).join("") : `<div class="vazio">Nenhum lote com esses filtros.</div>`;
  $("lista").querySelectorAll("details.sim").forEach((d) => d.addEventListener("toggle", () => d.open && montarSimulador(d)));
  $("lista").querySelectorAll("details.analise-det").forEach((d) => d.addEventListener("toggle", () => d.open && abrirAnalise(d)));
  $("mais").hidden = r.length <= estadoLe.mostrando;
}

function iniciarLeiloes(dados) {
  estadoLe.atualizado = `atualizado ${dataBR(dados.atualizado_em)} · ${dados.atualizado_em.slice(11)}`;
  estadoLe.lotes = dados.lotes.map((l) => {
    const item = { ...l, _tipo: tipoDoLote(l), _regiao: l.uf === "BA" ? regiaoDe(l.cidade) : null,
      _busca: semAcento(`${l.titulo} ${l.categoria} ${l.cidade} ${l.uf} ${l.fonte} ${(l.detalhes && l.detalhes.bairro) || ""}`) };
    item._est = ALUGUEL_CAIXA[l.id] || null;  // só apartamentos da Caixa têm estimativa
    item._rend = item._est && l.lance_atual ? item._est.valor * 12 / l.lance_atual : null;
    return item;
  });

  chips($("chips-tipo"), TIPOS, estadoLe, "tipo", () => desenharLe(true));
  const nRegiao = (r) => estadoLe.lotes.filter((l) => l._regiao === r).length;
  chips($("chips-cidade"), [{ id: "", nome: "Todas as regiões" }, ...REGIOES.map((r) => ({ id: r.nome, nome: `${r.nome} (${nRegiao(r.nome)})` }))],
    estadoLe, "cidade", () => desenharLe(true));
  const cidades = [...new Set(estadoLe.lotes.map((l) => l.cidade).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  $("sugestoes").innerHTML = cidades.map((c) => `<option value="${escapar(c)}">`).join("");
  const ufs = [...new Set(estadoLe.lotes.map((l) => l.uf).filter(Boolean))];
  ufs.sort((a, b) => (UFS_DESTAQUE.includes(b) - UFS_DESTAQUE.includes(a)) || a.localeCompare(b));
  chips($("chips-uf"), [{ id: "", nome: "Todos os estados" }, ...ufs.map((u) => ({ id: u, nome: UFS_DESTAQUE.includes(u) ? `★ ${u}` : u }))], estadoLe, "uf", () => desenharLe(true));

  const fontes = [...new Set(estadoLe.lotes.map((l) => l.fonte))].sort();
  $("fonte").innerHTML += fontes.map((f) => `<option>${escapar(f)}</option>`).join("");

  $("fontes").innerHTML = "Fontes da última coleta: " + Object.entries(dados.fontes).map(([n, s]) =>
    s.ok ? `${escapar(n)} (${s.lotes})` : s.dados_de
      ? `<span class="erro">${escapar(n)} (falhou agora; mostrando ${s.lotes} da coleta de ${dataBR(s.dados_de)} ${escapar(s.dados_de.slice(11))})</span>`
      : `<span class="erro">${escapar(n)} (falhou)</span>`).join(" · ");

  let espera;
  $("busca").oninput = () => { clearTimeout(espera); espera = setTimeout(() => desenharLe(true), 200); };
  ["publico", "fonte", "ordem", "variacao"].forEach((id) => ($(id).onchange = () => desenharLe(true)));
  $("mais").onclick = () => { estadoLe.mostrando += POR_PAGINA; desenharLe(false); };
  desenharLe(true);
}

/* ---------- Início ---------- */
async function carregar(arquivo) {
  const resp = await fetch(`dados/${arquivo}?v=${Date.now()}`, { cache: "no-store" });
  if (!resp.ok) throw new Error(resp.status);
  return resp.json();
}

async function iniciar() {
  $("aba-imoveis").onclick = () => trocarAba("imoveis");
  $("aba-leiloes").onclick = () => trocarAba("leiloes");
  let aba = "imoveis";
  try { aba = localStorage.getItem("aba") || "imoveis"; } catch (e) {}

  const [imoveis, leiloes, analises] = await Promise.allSettled([carregar("imoveis.json"), carregar("leiloes.json"), carregar("analises/indice.json")]);
  if (analises.status === "fulfilled") ANALISES = analises.value;
  // Imóveis primeiro: a referência de aluguel também é usada nos imóveis da Caixa
  if (imoveis.status === "fulfilled") iniciarImoveis(imoveis.value);
  else { estadoIm.atualizado = "sem dados"; $("im-lista").innerHTML = `<div class="vazio">Os imóveis ainda não foram coletados. Tente de novo mais tarde.</div>`; }
  if (leiloes.status === "fulfilled") iniciarLeiloes(leiloes.value);
  else { estadoLe.atualizado = "sem dados"; $("lista").innerHTML = `<div class="vazio">Não foi possível carregar os leilões agora.</div>`; }
  trocarAba(aba);
}

iniciar();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
