<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Imóveis e Leilões</title>
<meta name="description" content="Imóveis e leilões coletados todo dia">
<meta name="theme-color" content="#0f3d3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone-180.png">
<style>
  :root {
    --fundo: #f4f6f5;
    --cartao: #ffffff;
    --texto: #18211f;
    --suave: #5f6b68;
    --borda: #dfe5e3;
    --marca: #0f3d3e;
    --marca-texto: #ffffff;
    --destaque: #e8f4ef;
    --verde: #1d7a4f;
    --laranja: #b5560b;
    --vermelho: #b3261e;
    --azul: #1f5fa8;
    --chip: #eef2f1;
    --sombra: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0f1413;
      --cartao: #182120;
      --texto: #e8eeec;
      --suave: #9aa8a4;
      --borda: #2a3634;
      --marca: #123f40;
      --destaque: #15302a;
      --verde: #5fc795;
      --laranja: #f0a25c;
      --vermelho: #f2857c;
      --azul: #7fb0ec;
      --chip: #22302d;
      --sombra: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: var(--marca); color: var(--marca-texto);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 0;
    position: sticky; top: 0; z-index: 10;
  }
  .topo { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  .atualizado { font-size: 12px; opacity: .8; text-align: right; }
  nav { display: flex; gap: 4px; max-width: 1100px; margin: 10px auto 0; }
  nav button {
    flex: 1; border: 0; background: transparent; color: var(--marca-texto); opacity: .7;
    font: inherit; font-weight: 600; padding: 10px 8px 12px; border-bottom: 3px solid transparent; cursor: pointer;
  }
  nav button[aria-selected="true"] { opacity: 1; border-bottom-color: #8fe3bd; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }
  .filtros { display: grid; gap: 8px; margin-bottom: 12px; }
  .linha { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=search], select {
    font: inherit; font-size: 16px; color: var(--texto); background: var(--cartao);
    border: 1px solid var(--borda); border-radius: 10px; padding: 9px 11px; min-width: 0;
  }
  input[type=search] { flex: 1 1 220px; }
  select { flex: 1 1 140px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--borda); background: var(--cartao); color: var(--texto);
    font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--marca); color: var(--marca-texto); border-color: var(--marca); }
  .resumo { font-size: 13px; color: var(--suave); margin: 4px 2px 10px; }
  .lista { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .cartao {
    background: var(--cartao); border: 1px solid var(--borda); border-radius: 14px; box-shadow: var(--sombra);
    padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  }
  .cartao.prioridade { border-color: var(--verde); background: var(--destaque); }
  .cab { display: flex; gap: 10px; }
  .foto { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--chip); flex: none; }
  .foto.grande { width: 100%; height: 170px; }
  .titulo { font-weight: 600; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .meta { font-size: 12px; color: var(--suave); margin-top: 2px; }
  .ficha { font-size: 13px; color: var(--suave); display: flex; gap: 10px; flex-wrap: wrap; }
  .valores { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .preco { font-size: 19px; font-weight: 700; }
  .riscado { font-size: 13px; color: var(--suave); text-decoration: line-through; font-weight: 400; margin-left: 6px; }
  .rotulo { font-size: 11px; color: var(--suave); display: block; font-weight: 400; }
  .prazo { font-size: 13px; font-weight: 600; text-align: right; }
  .prazo.urgente { color: var(--vermelho); }
  .prazo.breve { color: var(--laranja); }
  .renda { font-size: 13px; background: var(--chip); border-radius: 10px; padding: 8px 10px; }
  .renda b { color: var(--verde); }
  .renda small { display: block; color: var(--suave); font-size: 11px; margin-top: 2px; }
  .selos { display: flex; gap: 6px; flex-wrap: wrap; }
  .selo { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--chip); color: var(--texto); }
  .selo.pf, .selo.fin { color: var(--verde); }
  .selo.pj { color: var(--azul); }
  .selo.desc { color: var(--laranja); }
  .selo.novo { background: var(--azul); color: #fff; }
  .selo.baixou { background: var(--verde); color: #fff; }
  .acoes a {
    display: block; text-align: center; text-decoration: none; font-weight: 600; font-size: 14px;
    padding: 9px; border-radius: 10px; background: var(--marca); color: var(--marca-texto);
  }
  details { font-size: 13px; }
  details summary { cursor: pointer; color: var(--azul); }
  details a { color: var(--azul); }
  details ul { margin: 6px 0 0; padding-left: 18px; }
  .mais { display: block; margin: 16px auto 0; font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--borda); background: var(--cartao); color: var(--texto); cursor: pointer; }
  .vazio { text-align: center; color: var(--suave); padding: 40px 16px; }
  .fontes { font-size: 12px; color: var(--suave); margin-top: 24px; line-height: 1.6; }
  .fontes .erro { color: var(--vermelho); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="topo">
    <h1>Radar Imóveis e Leilões</h1>
    <div class="atualizado" id="atualizado">carregando…</div>
  </div>
  <nav role="tablist">
    <button role="tab" id="aba-imoveis" aria-selected="true">Imóveis</button>
    <button role="tab" id="aba-leiloes" aria-selected="false">Leilões</button>
  </nav>
</header>

<main>
  <!-- ABA IMÓVEIS -->
  <section id="painel-imoveis">
    <div class="filtros">
      <div class="linha">
        <input type="search" id="im-busca" placeholder="Buscar: bairro, rua, condomínio…" autocomplete="off">
      </div>
      <div class="chips" id="im-chips-cidade" aria-label="Cidade"></div>
      <div class="chips" id="im-chips-marca" aria-label="Destaques"></div>
      <div class="linha">
        <select id="im-quartos" aria-label="Quartos">
          <option value="0">Quartos: todos</option>
          <option value="2">2+ quartos</option>
          <option value="3">3+ quartos</option>
        </select>
        <select id="im-ordem" aria-label="Ordenar">
          <option value="recentes">Mais recentes</option>
          <option value="menor">Menor preço</option>
          <option value="rendimento">Maior rendimento</option>
          <option value="m2">Menor preço por m²</option>
        </select>
      </div>
    </div>
    <div class="resumo" id="im-resumo"></div>
    <div class="lista" id="im-lista"></div>
    <button class="mais" id="im-mais" hidden>Mostrar mais</button>
    <div class="fontes" id="im-fontes"></div>
  </section>

  <!-- ABA LEILÕES -->
  <section id="painel-leiloes" hidden>
    <div class="filtros">
      <div class="linha">
        <input type="search" id="busca" placeholder="Buscar: iphone, notebook, apartamento…" autocomplete="off">
      </div>
      <div class="chips" id="chips-tipo" aria-label="Tipo"></div>
      <div class="chips" id="chips-uf" aria-label="Estado"></div>
      <div class="linha">
        <select id="publico" aria-label="Quem pode comprar">
          <option value="">PF e PJ (todos)</option>
          <option value="PF e PJ">Aceita pessoa física</option>
          <option value="Só PJ (CNPJ)">Só PJ (CNPJ)</option>
        </select>
        <select id="fonte" aria-label="Fonte"><option value="">Todas as fontes</option></select>
        <select id="ordem" aria-label="Ordenar">
          <option value="encerra">Encerra primeiro</option>
          <option value="menor">Menor valor</option>
          <option value="desconto">Maior desconto</option>
          <option value="rendimento">Maior rendimento (imóveis)</option>
        </select>
      </div>
    </div>
    <div class="resumo" id="resumo"></div>
    <div class="lista" id="lista"></div>
    <button class="mais" id="mais" hidden>Mostrar mais</button>
    <div class="fontes" id="fontes"></div>
  </section>
</main>

<script>
const UFS_DESTAQUE = ["SP", "RJ", "DF", "SC", "BA"];
const POR_PAGINA = 60;
const $ = (id) => document.getElementById(id);
const dinheiro = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const semAcento = (t) => (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const chave = (t) => semAcento(t).toUpperCase().replace(/'/g, " ").replace(/\s+/g, " ").trim();
const escapar = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dataBR = (iso) => iso ? iso.slice(0, 10).split("-").reverse().slice(0, 2).join("/") : "";

/* ---------- Aluguel estimado por comparáveis ---------- */
// Para cada imóvel, procura aluguéis do MESMO bairro, com os mesmos quartos e
// área parecida (±30%). Com menos de 3 comparáveis, não estima.
const ALUGUEIS = new Map();
const MIN_COMPARAVEIS = 3;

function indexarAlugueis(lista) {
  for (const a of lista) {
    if (!a.preco || !a.bairro) continue;
    const k = `${chave(a.cidade)}|${chave(a.bairro)}`;
    if (!ALUGUEIS.has(k)) ALUGUEIS.set(k, []);
    ALUGUEIS.get(k).push(a);
  }
}

function mediana(v) { const s = [...v].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

function aluguelEstimado(cidade, bairro, area, quartos) {
  const doBairro = ALUGUEIS.get(`${chave(cidade)}|${chave(bairro)}`) || [];
  const parecidos = (a) => (!quartos || a.quartos === quartos) && (!area || (a.area && a.area >= area * 0.7 && a.area <= area * 1.3));
  let comps = doBairro.filter(parecidos);
  let criterio = [quartos && `${quartos} quartos`, area && "área parecida"].filter(Boolean).join(" e ");
  if (comps.length < MIN_COMPARAVEIS && area) {
    // sem área parecida suficiente: usa o valor por m² dos aluguéis com os mesmos quartos
    const porM2 = doBairro.filter((a) => (!quartos || a.quartos === quartos) && a.area >= 25);
    // Área muito fora do que existe no bairro costuma ser erro do anúncio: não estima
    const maiorArea = Math.max(...porM2.map((a) => a.area));
    if (porM2.length >= MIN_COMPARAVEIS && area <= maiorArea * 1.3) {
      const valor = Math.min(mediana(porM2.map((a) => a.preco / a.area)) * area, Math.max(...porM2.map((a) => a.preco)));
      return { valor: Math.round(valor / 50) * 50, n: porM2.length, criterio: `${quartos ? quartos + " quartos, " : ""}pelo valor do m²` };
    }
  }
  if (comps.length < MIN_COMPARAVEIS) return null;
  return { valor: Math.round(mediana(comps.map((a) => a.preco)) / 50) * 50, n: comps.length, criterio };
}

function blocoRenda(est, preco) {
  if (!preco) return "";
  if (!est) return `<div class="renda">Aluguel estimado: <i>poucos aluguéis parecidos no bairro para comparar</i></div>`;
  const rend = (est.valor * 12 / preco) * 100;
  return `<div class="renda">Aluguel estimado <b>${dinheiro.format(est.valor)}/mês</b> · rendimento <b>${rend.toFixed(1).replace(".", ",")}% ao ano</b>
    <small>Mediana de ${est.n} aluguéis no mesmo bairro (${escapar(est.criterio)}). Bruto, sem condomínio, IPTU e vacância.</small></div>`;
}

/* ---------- Abas ---------- */
function trocarAba(qual) {
  const im = qual === "imoveis";
  $("aba-imoveis").setAttribute("aria-selected", im);
  $("aba-leiloes").setAttribute("aria-selected", !im);
  $("painel-imoveis").hidden = !im;
  $("painel-leiloes").hidden = im;
  $("atualizado").textContent = im ? estadoIm.atualizado : estadoLe.atualizado;
  try { localStorage.setItem("aba", qual); } catch (e) {}
}

function chips(el, itens, estado, campo, aoMudar) {
  el.innerHTML = itens.map((i) => `<button class="chip" data-v="${i.id}" aria-pressed="${estado[campo] === i.id}">${i.nome}</button>`).join("");
  el.onclick = (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    estado[campo] = b.dataset.v;
    el.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c.dataset.v === estado[campo]));
    aoMudar();
  };
}

/* ---------- IMÓVEIS ---------- */
const estadoIm = { grupos: [], cidade: "", marca: "", mostrando: POR_PAGINA, atualizado: "carregando…" };

function montarGrupos(anuncios) {
  const porGrupo = new Map();
  for (const a of anuncios) {
    if (!porGrupo.has(a.grupo)) porGrupo.set(a.grupo, []);
    porGrupo.get(a.grupo).push(a);
  }
  return [...porGrupo.values()].map((lista) => {
    lista.sort((x, y) => (x.preco ?? 1e12) - (y.preco ?? 1e12));
    const p = { ...lista[0], outros: lista.slice(1) };
    p.novo = lista.some((a) => a.novo);
    p.financiamento = lista.some((a) => a.financiamento === true) ? true : lista.some((a) => a.financiamento === false) ? false : null;
    p.condominio = lista.map((a) => a.condominio).find((v) => v) ?? null;
    p._est = aluguelEstimado(p.cidade, p.bairro, p.area, p.quartos);
    p._rend = p._est && p.preco ? p._est.valor * 12 / p.preco : null;
    p._m2 = p.area && p.preco ? p.preco / p.area : null;
    p._recente = lista.map((a) => a.primeiro_visto || a.publicado_em || "").sort().pop();
    p._busca = semAcento(`${p.titulo} ${p.bairro} ${p.cidade} ${p.endereco} ${p.anunciante}`);
    return p;
  });
}

function filtrarIm() {
  const busca = semAcento($("im-busca").value).split(/\s+/).filter(Boolean);
  const q = +$("im-quartos").value;
  let r = estadoIm.grupos.filter((g) => {
    if (estadoIm.cidade && g.cidade !== estadoIm.cidade) return false;
    if (estadoIm.marca === "novos" && !g.novo) return false;
    if (estadoIm.marca === "baixou" && !g.baixou_preco) return false;
    if (estadoIm.marca === "financiamento" && g.financiamento !== true) return false;
    if (estadoIm.marca === "rendimento" && !(g._rend >= 0.08)) return false;
    if (q && (g.quartos || 0) < q) return false;
    return busca.every((p) => g._busca.includes(p));
  });
  const o = $("im-ordem").value;
  if (o === "menor") r.sort((a, b) => (a.preco ?? 1e12) - (b.preco ?? 1e12));
  else if (o === "rendimento") r.sort((a, b) => (b._rend ?? -1) - (a._rend ?? -1));
  else if (o === "m2") r.sort((a, b) => (a._m2 ?? 1e12) - (b._m2 ?? 1e12));
  else r.sort((a, b) => (b.novo - a.novo) || (b.baixou_preco - a.baixou_preco) || (b._recente || "").localeCompare(a._recente || ""));
  return r;
}

function cartaoIm(g) {
  const selos = [];
  if (g.novo) selos.push(`<span class="selo novo">Novo</span>`);
  if (g.baixou_preco) selos.push(`<span class="selo baixou">Baixou de preço</span>`);
  if (g.financiamento === true) selos.push(`<span class="selo fin">Aceita financiamento</span>`);
  else if (g.financiamento === false) selos.push(`<span class="selo pj">Só à vista</span>`);
  else selos.push(`<span class="selo">Financiamento não informado</span>`);
  if (g.na_planta) selos.push(`<span class="selo">Na planta</span>`);
  selos.push(`<span class="selo">${escapar(g.fonte)}</span>`);

  const ficha = [g.quartos && `${g.quartos} quartos`, g.area && `${g.area} m²`, g.banheiros && `${g.banheiros} banh.`,
    g.condominio && `cond. ${dinheiro.format(g.condominio)}`, g._m2 && `${dinheiro.format(g._m2)}/m²`].filter(Boolean);

  const outros = g.outros.length ? `<details><summary>Mais ${g.outros.length} anúncio${g.outros.length > 1 ? "s" : ""} do mesmo imóvel</summary><ul>${
    g.outros.map((o) => `<li><a href="${escapar(o.link)}" target="_blank" rel="noopener">${escapar(o.anunciante || o.fonte)}</a> · ${o.preco ? dinheiro.format(o.preco) : "—"}</li>`).join("")}</ul></details>` : "";

  return `<article class="cartao${g.novo || g.baixou_preco ? " prioridade" : ""}">
    ${g.imagem ? `<img class="foto grande" loading="lazy" src="${escapar(g.imagem)}" alt="">` : ""}
    <div><div class="titulo">${escapar(g.titulo)}</div>
      <div class="meta">${escapar(g.bairro)}, ${escapar(g.cidade)}${g.anunciante ? " · " + escapar(g.anunciante) : ""}</div></div>
    <div class="valores"><div class="preco">${g.preco ? dinheiro.format(g.preco) : "—"}${g.baixou_preco && g.preco_anterior ? `<span class="riscado">${dinheiro.format(g.preco_anterior)}</span>` : ""}</div></div>
    <div class="ficha">${ficha.map((f) => `<span>${f}</span>`).join("")}</div>
    ${blocoRenda(g._est, g.preco)}
    <div class="selos">${selos.join("")}</div>
    ${outros}
    <div class="acoes"><a href="${escapar(g.link)}" target="_blank" rel="noopener">Ver anúncio</a></div>
  </article>`;
}

function desenharIm(reiniciar) {
  if (reiniciar) estadoIm.mostrando = POR_PAGINA;
  const r = filtrarIm();
  $("im-resumo").textContent = `${r.length.toLocaleString("pt-BR")} imóve${r.length === 1 ? "l" : "is"}`;
  $("im-lista").innerHTML = r.length ? r.slice(0, estadoIm.mostrando).map(cartaoIm).join("") : `<div class="vazio">Nenhum imóvel com esses filtros.</div>`;
  $("im-mais").hidden = r.length <= estadoIm.mostrando;
}

function iniciarImoveis(dados) {
  indexarAlugueis(dados.alugueis);
  estadoIm.atualizado = `atualizado ${dataBR(dados.atualizado_em)} · ${dados.atualizado_em.slice(11)}`;
  estadoIm.grupos = montarGrupos(dados.anuncios);
  const f = dados.filtros;
  chips($("im-chips-cidade"), [{ id: "", nome: "Todas as cidades" }, ...f.cidades.map((c) => ({ id: c, nome: c }))], estadoIm, "cidade", () => desenharIm(true));
  chips($("im-chips-marca"), [
    { id: "", nome: "Todos" }, { id: "novos", nome: "Novos" }, { id: "baixou", nome: "Baixaram de preço" },
    { id: "financiamento", nome: "Aceita financiamento" }, { id: "rendimento", nome: "Rendimento 8%+ ao ano" },
  ], estadoIm, "marca", () => desenharIm(true));
  $("im-fontes").innerHTML = `Apartamentos à venda até ${dinheiro.format(f.preco_maximo_compra)}, ${f.quartos_minimo}+ quartos. ` +
    `Aluguel estimado com base em ${dados.alugueis.length} anúncios de aluguel (até ${dinheiro.format(f.preco_maximo_aluguel)}).<br>Fontes: ` +
    Object.entries(dados.fontes).map(([n, s]) => s.ok ? `${escapar(n)} (${s.anuncios})` : `<span class="erro">${escapar(n)} (falhou)</span>`).join(" · ");
  let espera;
  $("im-busca").oninput = () => { clearTimeout(espera); espera = setTimeout(() => desenharIm(true), 200); };
  ["im-quartos", "im-ordem"].forEach((id) => ($(id).onchange = () => desenharIm(true)));
  $("im-mais").onclick = () => { estadoIm.mostrando += POR_PAGINA; desenharIm(false); };
  desenharIm(true);
}

/* ---------- LEILÕES ---------- */
const TIPOS = [
  { id: "", nome: "Tudo" },
  { id: "eletronicos", nome: "Eletrônicos e celulares" },
  { id: "eletrodomesticos", nome: "Eletrodomésticos" },
  { id: "imoveis", nome: "Imóveis Caixa" },
  { id: "prioritarias", nome: "Salvador, Feira e Conceição" },
];
const estadoLe = { lotes: [], tipo: "", uf: "", mostrando: POR_PAGINA, atualizado: "carregando…" };

function tipoDoLote(l) {
  if (l.fonte === "Caixa") return "imoveis";
  if (/ELETRODOM|ELETROPORT|REFRIGER|FOGO|FORNO|LIMPEZA|UTENS/i.test(l.categoria)) return "eletrodomesticos";
  return "eletronicos";
}

function dataDe(texto) {
  if (!texto) return null;
  const [d, h] = texto.split(" ");
  return new Date(`${d}T${h || "00:00"}:00-03:00`);
}

function prazo(l) {
  const fim = dataDe(l.encerramento);
  if (!fim) return { texto: l.fonte === "Caixa" ? "Venda direta" : "", classe: "" };
  const horas = (fim - Date.now()) / 36e5;
  const quando = fim.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
  if (horas < 0) return { texto: `Encerrado ${quando}`, classe: "urgente" };
  if (horas < 24) return { texto: `Encerra hoje · ${quando}`, classe: "urgente" };
  const dias = Math.round(horas / 24);
  return { texto: `Encerra em ${dias} dia${dias > 1 ? "s" : ""} · ${quando}`, classe: dias <= 3 ? "breve" : "" };
}

function desconto(l) {
  if (l.detalhes && l.detalhes.desconto_pct != null) return l.detalhes.desconto_pct;
  if (l.valor_avaliacao && l.lance_atual) return Math.round((1 - l.lance_atual / l.valor_avaliacao) * 100);
  return null;
}

function areaDaCaixa(l) {
  const m = /([\d.]+) de área privativa/.exec((l.detalhes && l.detalhes.descricao) || "") || /([\d.]+) de área total/.exec((l.detalhes && l.detalhes.descricao) || "");
  const v = m ? parseFloat(m[1]) : 0;
  return v > 0 ? v : null;
}

function filtrarLe() {
  const busca = semAcento($("busca").value).split(/\s+/).filter(Boolean);
  const publico = $("publico").value, fonte = $("fonte").value;
  const agora = Date.now();
  let r = estadoLe.lotes.filter((l) => {
    const fim = dataDe(l.encerramento);
    if (fim && fim < agora) return false;
    if (estadoLe.tipo === "prioritarias") { if (!l.prioridade) return false; }
    else if (estadoLe.tipo && l._tipo !== estadoLe.tipo) return false;
    if (estadoLe.uf && l.uf !== estadoLe.uf) return false;
    if (publico && l.publico !== publico) return false;
    if (fonte && l.fonte !== fonte) return false;
    return busca.every((p) => l._busca.includes(p));
  });
  const ordem = $("ordem").value;
  if (ordem === "menor") r.sort((a, b) => (a.lance_atual ?? 1e15) - (b.lance_atual ?? 1e15));
  else if (ordem === "desconto") r.sort((a, b) => (desconto(b) ?? -1) - (desconto(a) ?? -1));
  else if (ordem === "rendimento") r.sort((a, b) => (b._rend ?? -1) - (a._rend ?? -1));
  // Com data: o que encerra antes vem primeiro. Sem data (Caixa): cidades prioritárias primeiro.
  else r.sort((a, b) => (a.encerramento || "9").localeCompare(b.encerramento || "9") || (!!b.prioridade - !!a.prioridade) || (!!b.destaque - !!a.destaque));
  return r;
}

function cartaoLe(l) {
  const p = prazo(l), d = desconto(l);
  const selos = [];
  selos.push(l.publico === "Só PJ (CNPJ)" ? `<span class="selo pj">Só PJ (CNPJ)</span>` : `<span class="selo pf">PF e PJ</span>`);
  if (l.detalhes && l.detalhes.financiamento) selos.push(`<span class="selo fin">Aceita financiamento</span>`);
  if (d != null && d > 0) selos.push(`<span class="selo desc">${Math.round(d)}% abaixo da avaliação</span>`);
  selos.push(`<span class="selo">${escapar(l.fonte)}</span>`);
  const rotulo = l.fonte === "Receita Federal" ? "Lance mínimo" : l.fonte === "Caixa" ? "Preço" : "Lance atual";
  const foto = l.imagem ? `<img class="foto" loading="lazy" src="${escapar(l.imagem)}" alt="">` : "";
  return `<article class="cartao${l.prioridade ? " prioridade" : ""}">
    <div class="cab">${foto}<div style="min-width:0">
      <div class="titulo">${escapar(l.titulo)}</div>
      <div class="meta">${escapar(l.cidade)}${l.uf ? " - " + escapar(l.uf) : ""} · ${escapar(l.categoria)}</div>
    </div></div>
    <div class="valores">
      <div class="preco"><span class="rotulo">${rotulo}</span>${l.lance_atual != null ? dinheiro.format(l.lance_atual) : "—"}</div>
      <div class="prazo ${p.classe}">${escapar(p.texto)}</div>
    </div>
    ${l._tipo === "imoveis" && /apartamento/i.test(l.categoria) ? blocoRenda(l._est, l.lance_atual) : ""}
    <div class="selos">${selos.join("")}</div>
    <div class="acoes"><a href="${escapar(l.link)}" target="_blank" rel="noopener">Abrir no site do leilão</a></div>
  </article>`;
}

function desenharLe(reiniciar) {
  if (reiniciar) estadoLe.mostrando = POR_PAGINA;
  const r = filtrarLe();
  $("resumo").textContent = `${r.length.toLocaleString("pt-BR")} resultado${r.length === 1 ? "" : "s"}`;
  $("lista").innerHTML = r.length ? r.slice(0, estadoLe.mostrando).map(cartaoLe).join("") : `<div class="vazio">Nenhum lote com esses filtros.</div>`;
  $("mais").hidden = r.length <= estadoLe.mostrando;
}

function iniciarLeiloes(dados) {
  estadoLe.atualizado = `atualizado ${dataBR(dados.atualizado_em)} · ${dados.atualizado_em.slice(11)}`;
  estadoLe.lotes = dados.lotes.map((l) => {
    const item = { ...l, _tipo: tipoDoLote(l), _busca: semAcento(`${l.titulo} ${l.categoria} ${l.cidade} ${l.uf} ${l.fonte}`) };
    if (l.fonte === "Caixa" && /apartamento/i.test(l.categoria)) {
      const q = /(\d+) qto/.exec((l.detalhes && l.detalhes.descricao) || "");
      item._est = aluguelEstimado(l.cidade, l.detalhes && l.detalhes.bairro, areaDaCaixa(l), q ? +q[1] : null);
      item._rend = item._est && l.lance_atual ? item._est.valor * 12 / l.lance_atual : null;
    }
    return item;
  });

  chips($("chips-tipo"), TIPOS, estadoLe, "tipo", () => desenharLe(true));
  const ufs = [...new Set(estadoLe.lotes.map((l) => l.uf).filter(Boolean))];
  ufs.sort((a, b) => (UFS_DESTAQUE.includes(b) - UFS_DESTAQUE.includes(a)) || a.localeCompare(b));
  chips($("chips-uf"), [{ id: "", nome: "Todos os estados" }, ...ufs.map((u) => ({ id: u, nome: UFS_DESTAQUE.includes(u) ? `★ ${u}` : u }))], estadoLe, "uf", () => desenharLe(true));

  const fontes = [...new Set(estadoLe.lotes.map((l) => l.fonte))].sort();
  $("fonte").innerHTML += fontes.map((f) => `<option>${escapar(f)}</option>`).join("");

  $("fontes").innerHTML = "Fontes da última coleta: " + Object.entries(dados.fontes).map(([n, s]) =>
    s.ok ? `${escapar(n)} (${s.lotes})` : `<span class="erro">${escapar(n)} (falhou)</span>`).join(" · ");

  let espera;
  $("busca").oninput = () => { clearTimeout(espera); espera = setTimeout(() => desenharLe(true), 200); };
  ["publico", "fonte", "ordem"].forEach((id) => ($(id).onchange = () => desenharLe(true)));
  $("mais").onclick = () => { estadoLe.mostrando += POR_PAGINA; desenharLe(false); };
  desenharLe(true);
}

/* ---------- Início ---------- */
async function carregar(arquivo) {
  const resp = await fetch(`dados/${arquivo}?v=${Date.now()}`, { cache: "no-store" });
  if (!resp.ok) throw new Error(resp.status);
  return resp.json();
}

async function iniciar() {
  $("aba-imoveis").onclick = () => trocarAba("imoveis");
  $("aba-leiloes").onclick = () => trocarAba("leiloes");
  let aba = "imoveis";
  try { aba = localStorage.getItem("aba") || "imoveis"; } catch (e) {}

  const [imoveis, leiloes] = await Promise.allSettled([carregar("imoveis.json"), carregar("leiloes.json")]);
  // Imóveis primeiro: a referência de aluguel também é usada nos imóveis da Caixa
  if (imoveis.status === "fulfilled") iniciarImoveis(imoveis.value);
  else { estadoIm.atualizado = "sem dados"; $("im-lista").innerHTML = `<div class="vazio">Os imóveis ainda não foram coletados. Tente de novo mais tarde.</div>`; }
  if (leiloes.status === "fulfilled") iniciarLeiloes(leiloes.value);
  else { estadoLe.atualizado = "sem dados"; $("lista").innerHTML = `<div class="vazio">Não foi possível carregar os leilões agora.</div>`; }
  trocarAba(aba);
}

iniciar();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
