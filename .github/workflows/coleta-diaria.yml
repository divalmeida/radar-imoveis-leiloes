name: Coleta diária

on:
  schedule:
    # Todo dia às 07:00 de Brasília (10:00 UTC)
    - cron: "0 10 * * *"
  # Permite rodar na hora pelo botão "Run workflow"
  workflow_dispatch:
  # Roda também quando o código dos coletores muda (para testar na nuvem)
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "coletar_leiloes.py"
      - "requirements.txt"
      - ".github/workflows/coleta-diaria.yml"

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar navegador para sites com anti-robô
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Coletar leilões
        run: python coletar_leiloes.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Salvar os dados no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/dados
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados."
          else
            git commit -m "Coleta automática $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
            # Se alguém enviou código durante a coleta, junta antes de enviar
            git pull --rebase
            git push
          fi
