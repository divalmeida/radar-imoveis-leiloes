name: Coleta diária

on:
  schedule:
    # 3 vezes ao dia: 06:17, 12:17 e 18:17 de Brasília (09:17, 15:17 e 21:17 UTC).
    # Minuto "quebrado" porque no horário cheio o GitHub atrasa mais.
    - cron: "17 9,15,21 * * *"
  # Permite rodar na hora pelo botão "Run workflow"
  workflow_dispatch:
  # Roda também quando o código dos coletores muda (para testar na nuvem)
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "coletar_leiloes.py"
      - "coletar_imoveis.py"
      - "enviar_alertas.py"
      - ".github/workflows/coleta-diaria.yml"

permissions:
  contents: write

# Uma coleta por vez de cada tipo (horário, botão, envio de código).
# Tipos diferentes não se cancelam: o botão "Run workflow" nunca é descartado
# por causa de um envio de código. A gravação dos dados já evita conflito.
concurrency:
  group: coleta-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guardar os dados de ontem (para saber o que é novo)
        run: cp -r docs/dados /tmp/dados-anteriores

      - name: Coletar leilões
        run: python coletar_leiloes.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Coletar imóveis
        # Se os imóveis falharem, os leilões ainda são salvos
        continue-on-error: true
        timeout-minutes: 25
        run: python coletar_imoveis.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Enviar alertas
        # Só na coleta das 07:00 (ou pelo botão), para não mandar alerta a cada envio de código
        if: github.event_name != 'push'
        continue-on-error: true
        run: python enviar_alertas.py /tmp/dados-anteriores
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_VOCE: ${{ secrets.TELEGRAM_CHAT_VOCE }}
          TELEGRAM_CHAT_LORE: ${{ secrets.TELEGRAM_CHAT_LORE }}
          ALERTA_SEMPRE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - name: Salvar os dados no repositório
        run: |
          # Guarda os dados coletados, pega a versão mais nova do repositório
          # (pode ter chegado código novo durante a coleta) e põe os dados por cima
          cp -r docs/dados /tmp/dados-novos
          git fetch origin main
          git reset --hard origin/main
          cp -r /tmp/dados-novos/. docs/dados/
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/dados
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados."
          else
            git commit -m "Coleta automática $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
            git push
          fi
