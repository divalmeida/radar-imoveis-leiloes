name: Coleta diária

on:
  schedule:
    # Todo dia às 07:00 de Brasília (10:00 UTC)
    - cron: "0 10 * * *"
  # Permite rodar na hora pelo botão "Run workflow"
  workflow_dispatch:
  # Roda também quando o código dos coletores muda (para testar na nuvem)
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "coletar_leiloes.py"
      - "coletar_imoveis.py"
      - "requirements.txt"
      - ".github/workflows/coleta-diaria.yml"

permissions:
  contents: write

# Uma coleta por vez; se chegar outra, ela espera a atual terminar
concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar navegador para sites com anti-robô
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Coletar leilões
        run: python coletar_leiloes.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Coletar imóveis
        # Se os imóveis falharem, os leilões ainda são salvos
        continue-on-error: true
        timeout-minutes: 25
        run: python coletar_imoveis.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Salvar os dados no repositório
        run: |
          # Guarda os dados coletados, pega a versão mais nova do repositório
          # (pode ter chegado código novo durante a coleta) e põe os dados por cima
          cp -r docs/dados /tmp/dados-novos
          git fetch origin main
          git reset --hard origin/main
          cp -r /tmp/dados-novos/. docs/dados/
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/dados
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados."
          else
            git commit -m "Coleta automática $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
            git push
          fi
